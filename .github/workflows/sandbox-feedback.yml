name: Sandbox feedback (live, real bug-fix history)

# Measures whether showing the failing test output to the model (SANDBOX_FEEDBACK_ATTEMPTS) helps, on a REAL bug fix.
# One run gives both numbers: the first attempt's verdict on the real regression test (= without feedback) and the
# verdict after one feedback round. Needs Docker (the library's tests run with no network) and secret GROQ_API_KEY.
# Cost: about 25-40k tokens per case. Default is ONE case.

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Branch of the target repo (the feature branch until it is merged)"
        default: "feat/sandbox-feedback"
      library:
        description: "Library whose bug-fix history is used (owner/name)"
        default: "astanin/python-tabulate"
      max_cases:
        description: "How many cases to run"
        default: "1"
      rounds:
        description: "Feedback rounds per case"
        default: "1"

permissions:
  contents: read

env:
  TARGET_REPO: carlsberk/OpsPulse-AI-Autonomous-Incident-Response-RCA-Agent

jobs:
  feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Require the API key
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then echo "::error::secret GROQ_API_KEY is not set"; exit 1; fi

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ inputs.target_ref }}

      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.library }}
          path: lib
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements-dev.txt

      - name: Build the no-network test image
        run: docker build -t opspulse-history-tests -f evals/history_tests.Dockerfile evals

      - name: Build the dataset from the library's bug-fix history
        run: |
          python -m evals.history_real_repo build --repo-dir lib --python docker:opspulse-history-tests \
            --repo-name "${{ inputs.library }}" --out /tmp/history.json --scan 60 --max-cases "${{ inputs.max_cases }}"

      - name: Run first attempt, real test, feedback round, real test
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -m evals.sandbox_feedback_eval --dataset /tmp/history.json --repo-dir lib \
            --python docker:opspulse-history-tests --max-cases "${{ inputs.max_cases }}" \
            --rounds "${{ inputs.rounds }}" --sleep 20 --out /tmp/out

      - name: Publish the result as annotations
        if: always()
        run: |
          python - <<'PY'
          import glob, json
          files = sorted(glob.glob("/tmp/out/sandbox-feedback-*.json"))
          if not files:
              print("::warning title=Feedback eval::no report was written"); raise SystemExit(0)
          report = json.load(open(files[-1]))
          print(f"::notice title=Feedback summary::{json.dumps(report['summary'])}")
          lines = []
          for r in report["rows"]:
              rounds = ";".join(f"gate={x['gate_passed']} verdict={x.get('verdict')}" for x in r["rounds"]) or "-"
              lines.append(f"{r['case_id']}: first={r['first_verdict']} ({r['first_detail'][:140]}) "
                           f"final={r['final_verdict']} rounds=[{rounds}] tokens_in_out={r['tokens_in_out']} "
                           f"attempts={r['attempts']}")
          print("::notice title=Feedback cases::" + "%0A".join(lines))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox-feedback-report
          path: /tmp/out/
